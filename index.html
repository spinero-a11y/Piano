<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Piano Virtual Profesional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="page-body">
    <div class="app-container">
        <!-- Panel de Control Superior -->
        <div class="control-panel">
            <div class="control-group">
                <label>🔊 Volumen</label>
                <input type="range" id="volume" min="0" max="1" step="0.05" value="0.5">
            </div>

            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="sustain"> 
                    <span>🎹 Modo Sustain (Eco)</span>
                </label>
            </div>

            <div class="control-group">
                <label>🎨 Color de Fondo</label>
                <input type="color" id="bgColorPicker" value="#1a1a2e">
            </div>

            <div class="control-group">
                <label>⌨️ Guía de Teclas</label>
                <select id="labelMode">
                    <option value="notes">Notas (Do, Re, Mi)</option>
                    <option value="abc">Cifrado (A, B, C)</option>
                    <option value="qwerty">Teclado PC (QWERTY)</option>
                </select>
            </div>
        </div>

        <!-- Estructura del Piano Realista -->
        <div class="piano-case" id="pianoCase">
            <div class="piano-brand">SYNTH & KEYS</div>
            <div class="keyboard" id="keyboard">
                <!-- Las teclas se generarán automáticamente desde JavaScript para que sean muchas más -->
            </div>
        </div>
    </div>

    <!-- Librería de audio Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="script.js"></script>
</body>
</html>
